version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: innovatech-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: innovatech2025
      MYSQL_DATABASE: despachos
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pinnovatech2025"]
      interval: 10s
      timeout: 5s
      retries: 5

  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: innovatech-back-despachos
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: innovatech-back-ventas
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    container_name: innovatech-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - back-despachos
      - back-ventas
    networks:
      - frontend-net

volumes:
  db_data:
    driver: local

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge